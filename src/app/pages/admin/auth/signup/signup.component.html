<div class="login-parent">
  <div class="login-wrapper">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <h1 class="login-title">Register</h1>

      <!-- Username -->
      <div class="input-box">
        <input
          type="text"
          placeholder="Username"
          formControlName="username"
          (blur)="form.get('username')?.markAsTouched()"
        />
        <div
          *ngIf="
            form.get('username')?.touched &&
            form.get('username')?.hasError('required')
          "
          class="validation-message"
        >
          Field must not be empty
        </div>
      </div>

      <!-- Email -->
      <div class="input-box">
        <input
          type="email"
          placeholder="Your email"
          formControlName="email"
          (blur)="form.get('email')?.markAsTouched()"
        />
        <div
          *ngIf="
            form.get('email')?.touched &&
            form.get('email')?.hasError('required')
          "
          class="validation-message"
        >
          Field must not be empty
        </div>
        <div
          *ngIf="
            form.get('email')?.touched && form.get('email')?.hasError('email')
          "
          class="validation-message"
        >
          Please enter a valid email address
        </div>
      </div>

      <!-- Password -->
      <div class="input-box">
        <input
          type="password"
          placeholder="Your password"
          formControlName="password"
          (blur)="form.get('password')?.markAsTouched()"
        />
        <div
          *ngIf="
            form.get('password')?.touched &&
            form.get('password')?.hasError('required')
          "
          class="validation-message"
        >
          Field must not be empty
        </div>
        <div
          *ngIf="
            form.get('password')?.touched &&
            form.get('password')?.hasError('minlength')
          "
          class="validation-message"
        >
          Password must be at least 6 characters
        </div>
      </div>

      <!-- Register Button -->
      <button
        type="submit"
        [disabled]="form.invalid || isLoading"
        class="btn-login"
        *ngIf="!isLoading"
      >
        Register
      </button>
      <mat-spinner *ngIf="isLoading" class="spinner"></mat-spinner>

      <!-- Login Link -->
      <div class="link">
        <p>
          Already have an account?
          <a routerLink="/login">Login</a>
        </p>
      </div>
    </form>
  </div>
</div>
