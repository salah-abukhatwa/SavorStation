<div class="row g-3">
  <!-- Product List -->
  <div [ngClass]="isSidePanelVisible ? 'col-lg-8' : 'col-12'">
    <div class="card shadow-lg border-0 rounded-3">
      <div
        class="card-header bg-white d-flex justify-content-between align-items-center"
      >
        <h5 class="mb-0 fw-bold text-primary">📦 Product List</h5>
        <button
          class="btn btn-success btn-sm d-flex align-items-center gap-1"
          (click)="openSidePanel()"
        >
          <i class="fa fa-plus"></i> New
        </button>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div
            class="col-12 col-md-4 col-xl-3"
            *ngFor="let product of productList"
          >
            <div class="card product-card h-100">
              <img
                [src]="product.productImageUrl"
                class="card-img-top product-image"
                alt="Card Image"
              />
              <div class="card-body text-center">
                <h6 class="card-title fw-bold text-dark">
                  {{ product.productName }}
                </h6>
                <p class="card-text text-muted small">
                  {{ product.categoryName }}
                </p>
                <div class="d-flex justify-content-center gap-2">
                  <button
                    class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1"
                    (click)="onEdit(product)"
                  >
                    <i class="fa fa-pen"></i> Edit
                  </button>
                  <button
                    class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1"
                    (click)="onDelete(product)"
                  >
                    <i class="fa fa-trash"></i> Delete
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Side Panel / Bottom Drawer -->
  <div
    [ngClass]="{ 'col-lg-4': isSidePanelVisible }"
    *ngIf="isSidePanelVisible"
  >
    <div class="card shadow-lg border-0 rounded-3 side-panel">
      <div
        class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
      >
        <h6 class="mb-0">
          {{ productObj.productId ? "✏️ Edit Product" : "➕ New Product" }}
        </h6>
        <button
          class="btn btn-sm btn-light text-dark"
          (click)="closeSidePanel()"
        >
          ✖ Close
        </button>
      </div>
      <div class="card-body">
        <form>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">SKU</label>
              <input
                type="text"
                [(ngModel)]="productObj.productSku"
                name="sku"
                class="form-control form-control-sm"
              />
            </div>
            <div class="col-6">
              <label class="form-label">Name</label>
              <input
                type="text"
                [(ngModel)]="productObj.productName"
                name="name"
                class="form-control form-control-sm"
              />
            </div>
            <div class="col-6">
              <label class="form-label">Short Name</label>
              <input
                type="text"
                [(ngModel)]="productObj.productShortName"
                name="shortName"
                class="form-control form-control-sm"
              />
            </div>
            <div class="col-6">
              <label class="form-label">Price</label>
              <input
                type="number"
                [(ngModel)]="productObj.productPrice"
                name="price"
                class="form-control form-control-sm"
              />
            </div>
            <div class="col-6">
              <label class="form-label">Category</label>
              <select
                [(ngModel)]="productObj.categoryId"
                name="category"
                class="form-select form-select-sm"
              >
                <option
                  *ngFor="let category of categoryList"
                  [value]="category.categoryId"
                >
                  {{ category.categoryName }}
                </option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">Delivery Time (Days)</label>
              <input
                type="number"
                [(ngModel)]="productObj.deliveryTimeSpan"
                name="deliveryTime"
                class="form-control form-control-sm"
              />
            </div>
            <div class="col-12">
              <label class="form-label">Image URL</label>
              <input
                type="text"
                [(ngModel)]="productObj.productImageUrl"
                name="imageUrl"
                class="form-control form-control-sm"
              />
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea
                [(ngModel)]="productObj.productDescription"
                name="description"
                rows="2"
                class="form-control form-control-sm"
              ></textarea>
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between mt-3">
            <button
              type="button"
              class="btn btn-outline-secondary btn-sm"
              (click)="resetForm()"
            >
              Reset
            </button>
            <button
              type="button"
              class="btn btn-success btn-sm"
              *ngIf="productObj.productId == ''"
              (click)="onSave()"
            >
              ✅ Create
            </button>
            <button
              type="button"
              class="btn btn-primary btn-sm"
              *ngIf="productObj.productId !== ''"
              (click)="onUpdate()"
            >
              💾 Update
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
